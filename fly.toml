# Fly.io deployment for the signaling server.
#
#   fly launch --no-deploy --copy-config
#   fly volumes create c2c_data --size 1
#   fly secrets set JWT_SECRET=... TURNSTILE_SECRET=... \
#       CLOUDFLARE_TURN_KEY_ID=... CLOUDFLARE_TURN_API_TOKEN=...
#   fly deploy

app = "c2c-signaling"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  DATA_DIR = "/data"
  # Replace with the deployed frontend origin.
  ALLOWED_ORIGINS = "https://c2c.pages.dev"

# Reports, evidence and ban state must survive a restart.
[[mounts]]
  source = "c2c_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Matchmaking state lives in this process's memory, so it must not be
  # stopped between connections and must not scale to zero.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
