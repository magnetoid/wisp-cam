# coturn configuration for Wisp Cam.
#
# Dynamic values (realm, external IP, shared secret) are passed as command-line
# arguments from docker-compose, which override anything set here.

listening-port=3478
tls-listening-port=5349

# Bind everything; the container uses host networking so this is the host's
# interface set.
listening-ip=0.0.0.0

# Credentials are time-limited HMACs computed from a shared secret, matching
# what the signaling server mints in server/src/turn.ts. No user database.
use-auth-secret

# Relay port range. Deliberately narrow: coturn's default spans ~16k ports,
# which is far more than a small deployment needs and makes firewall rules
# unwieldy. Each relayed stream consumes a port, so ~500 covers a lot of
# concurrent relayed calls (only ~15-20% of calls relay at all).
min-port=50000
max-port=50500

# WebRTC requires message fingerprints.
fingerprint

stale-nonce=600

# --- Hardening -------------------------------------------------------------
# An open TURN server is a proxy into whatever it can reach. Without these
# denials, anyone could relay traffic to services on the host or the private
# network behind it, which is a genuine SSRF vector rather than a theoretical
# one. Allow only public address space.
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1

denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255

denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Cap what a single session can consume.
user-quota=12
total-quota=1200

# Logging to stdout so `docker compose logs` works; no rotating files to manage.
log-file=stdout
simple-log
