# coturn TURN relay for Wisp Cam — a SEPARATE Coolify resource.
#
# Create as: New Resource -> Docker Compose Empty, and paste this in.
# Assign NO domain: this service is not behind the proxy and cannot be.
#
# Why it is separate from the app stack:
#   - TURN allocates relay ports across a UDP range, which an HTTP reverse
#     proxy cannot carry. It needs host networking.
#   - Keeping it apart means redeploying the app doesn't drop live relayed
#     calls.
#
# Why host networking rather than published ports: Docker starts one userland
# proxy process per published port, so publishing a relay range is either
# extremely slow to start or fails outright. Host networking also gives the
# 1:1 external/internal port identity that TURN requires.

services:
  coturn:
    image: coturn/coturn:4.7-alpine
    network_mode: host
    restart: unless-stopped
    volumes:
      # `content:` is a Coolify extension that materialises the file on the
      # host and interpolates ${VARS}. Keeps this resource self-contained with
      # no Git repo attached.
      - type: bind
        source: ./turnserver.conf
        target: /etc/coturn/turnserver.conf
        content: |
          realm=${TURN_REALM}
          server-name=${TURN_REALM}

          listening-ip=0.0.0.0
          listening-port=3478
          tls-listening-port=5349

          # The public IPv4 advertised in relay candidates. A wrong value here
          # produces candidates that nobody can reach, which looks exactly like
          # "TURN is broken" with no error anywhere.
          external-ip=${TURN_EXTERNAL_IP}

          # Narrow on purpose; coturn's default range spans ~16k ports.
          min-port=50000
          max-port=50500

          # Time-limited HMAC credentials, matching what the signaling server
          # mints in server/src/turn.ts. Do NOT also set lt-cred-mech: this
          # option enables it internally and setting both causes confusion.
          use-auth-secret
          static-auth-secret=${TURN_STATIC_AUTH_SECRET}

          fingerprint
          stale-nonce=600

          # An open TURN server relays to whatever it can reach. Without these
          # denials it is a proxy into the host's private network — which on a
          # Coolify box means every other container, including the dashboard
          # and its database.
          no-cli
          no-multicast-peers
          no-tlsv1
          no-tlsv1_1

          denied-peer-ip=0.0.0.0-0.255.255.255
          denied-peer-ip=10.0.0.0-10.255.255.255
          denied-peer-ip=100.64.0.0-100.127.255.255
          denied-peer-ip=127.0.0.0-127.255.255.255
          denied-peer-ip=169.254.0.0-169.254.255.255
          denied-peer-ip=172.16.0.0-172.31.255.255
          denied-peer-ip=192.0.0.0-192.0.0.255
          denied-peer-ip=192.168.0.0-192.168.255.255
          denied-peer-ip=198.18.0.0-198.19.255.255
          denied-peer-ip=224.0.0.0-255.255.255.255
          denied-peer-ip=::1
          denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
          denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

          user-quota=12
          total-quota=1200

          log-file=stdout
          simple-log
      - coturn-data:/var/lib/coturn
    command:
      - -c
      - /etc/coturn/turnserver.conf

volumes:
  coturn-data:
