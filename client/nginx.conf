server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints asset filenames, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The NSFW model weights are a large, immutable lazy-loaded chunk.
    location ~* \.(bin|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths fall through to the shell, never a 404.
    # index.html itself must not be cached or users get stuck on a stale build.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # getUserMedia is only permitted from this origin; no third party embeds it.
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Deny framing: a clickjacked camera prompt is a real risk for this app.
    add_header X-Frame-Options "DENY" always;
}
