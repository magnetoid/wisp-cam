# Wisp Cam — application stack (web + signaling).
#
# This is the file Coolify picks up by default, and it is deliberately safe for
# Coolify's build step:
#
#   * No required-variable syntax (the "VAR:?message" form) anywhere.
#     `docker compose build`
#     interpolates the WHOLE file, including services it is not building, and
#     Coolify's build step is given only build-time variables — so a `:?` on any
#     runtime variable aborts the build with "required variable X is missing",
#     no matter what you set in the UI.
#   * No coturn. TURN needs host networking and raw UDP, so it cannot sit behind
#     the proxy; it is deployed separately (see deploy/coolify/coturn.compose.yml).
#   * No top-level `networks:`. Coolify injects its own, and a second network
#     makes Traefik route to the wrong container IP intermittently.
#
# Required variables — set these in Coolify, or in .env for a plain Docker host:
#   JWT_SECRET                 openssl rand -hex 32
#   VITE_SERVER_URL            https://api.wisp.best   (tick "Build Variable")
#   TURN_URLS                  turn:turn.wisp.best:3478?transport=udp,...
#   TURN_STATIC_AUTH_SECRET    must match coturn exactly
#
# The signaling server refuses to start in production without JWT_SECRET, so a
# missing value fails loudly at boot rather than silently.
#
# Plain Docker host:
#   cp .env.example .env && docker compose up -d --build
#   docker compose -f deploy/coturn.compose.yml up -d      # TURN, separately
#
# Coolify: see deploy/COOLIFY.md

services:
  web:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        # List syntax, not mapping: Coolify merges build args into the service's
        # `environment`, and mixing mapping args with a list environment yields
        # "non-string key in services.web.environment" at build time.
        #
        # Vite inlines this at BUILD time. In Coolify this variable MUST have
        # "Build Variable" ticked, or it resolves to empty here and the bundle
        # ships pointing nowhere — with no build error to warn you.
        - VITE_SERVER_URL=${VITE_SERVER_URL:-http://localhost:8080}
    restart: unless-stopped
    environment:
      # Seeds a default domain on first deploy; the value set in the Coolify UI
      # wins afterwards. Harmless outside Coolify.
      - SERVICE_FQDN_WEB_80
    # Deliberately `expose`, not `ports`. The proxy reaches this container over
    # the internal network, and publishing to the host collides with whatever
    # else is running there — which is how this first failed to start.
    expose:
      - '80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  signaling:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - web
    environment:
      - SERVICE_FQDN_SIGNALING_8080
      - NODE_ENV=production
      - PORT=8080
      - DATA_DIR=/data

      # Every browser origin the app is served from, comma-separated.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8081}

      - JWT_SECRET=${JWT_SECRET:-}
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-21600}

      # Bot gate. Unset disables it — acceptable locally, not in production.
      - TURNSTILE_SECRET=${TURNSTILE_SECRET:-}
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}

      # Points at the separately-deployed coturn. Keep these runtime-only:
      # build args are recorded in image metadata and visible in docker history.
      - TURN_URLS=${TURN_URLS:-}
      - TURN_STATIC_AUTH_SECRET=${TURN_STATIC_AUTH_SECRET:-}
      - TURN_TTL_SECONDS=${TURN_TTL_SECONDS:-7200}

      - ABUSE_CONTACT_EMAIL=${ABUSE_CONTACT_EMAIL:-abuse@wisp.best}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-30}
    volumes:
      # Abuse reports, evidence frames, and ban state. Renaming this volume
      # orphans the existing data — treat the name as immutable.
      - wisp-data:/data
    expose:
      - '8080'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  wisp-data:
