# Wisp Cam — full stack for a plain Docker host (no Coolify).
#
#   cp .env.example .env   # fill in JWT_SECRET, TURN_*, domains
#   docker compose up -d --build
#
# Put a TLS terminator (Caddy, nginx, Traefik) in front of `web` and
# `signaling`: getUserMedia refuses to run on anything but HTTPS or localhost.
#
# Deploying on Coolify instead? Use deploy/coolify/ — the proxy, TLS and
# routing all work differently there, and coturn has to be its own resource.

services:
  signaling:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      DATA_DIR: /data

      # Every origin the browser loads the app from, comma-separated.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://wisp.best}

      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-21600}

      # Bot gate. Unset disables it — fine locally, not in production.
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}

      TURN_URLS: ${TURN_URLS:-}
      TURN_STATIC_AUTH_SECRET: ${TURN_STATIC_AUTH_SECRET:-}
      TURN_TTL_SECONDS: ${TURN_TTL_SECONDS:-7200}

      ABUSE_CONTACT_EMAIL: ${ABUSE_CONTACT_EMAIL:-abuse@wisp.best}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
    volumes:
      # Abuse reports, evidence frames, and ban state. Losing this loses every
      # ban and every report awaiting review.
      - wisp-data:/data
    ports:
      - '${SIGNALING_PORT:-8080}:8080'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        # Inlined into the bundle at build time; changing it needs a rebuild.
        VITE_SERVER_URL: ${VITE_SERVER_URL:-https://api.wisp.best}
    restart: unless-stopped
    depends_on:
      - signaling
    ports:
      - '${WEB_PORT:-8081}:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  coturn:
    image: coturn/coturn:4.7-alpine
    restart: unless-stopped
    # Required: TURN allocates relay ports across a range, and publishing that
    # range through Docker's userland proxy is unworkably slow. Host networking
    # also gives the 1:1 external/internal port identity TURN depends on.
    network_mode: host
    volumes:
      - ./deploy/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - coturn-data:/var/lib/coturn
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --realm=${TURN_REALM:-wisp.best}
      - --server-name=${TURN_REALM:-wisp.best}
      # The host's public IPv4. Wrong value here yields unreachable candidates.
      - --external-ip=${TURN_EXTERNAL_IP:?set TURN_EXTERNAL_IP in .env}
      - --static-auth-secret=${TURN_STATIC_AUTH_SECRET:?set TURN_STATIC_AUTH_SECRET in .env}

volumes:
  wisp-data:
  coturn-data:
